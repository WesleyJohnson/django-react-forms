name: Release

# Runs when a version tag is pushed (git tag v0.1.0 && git push --tags). See "Releasing" in
# CONTRIBUTING.md for the one-time setup (PyPI and npm trusted publishers).
on:
  push:
    tags: ['v*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches both packages' versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          python_version=$(sed -nE 's/^version = "(.*)"/\1/p' python/pyproject.toml | head -1)
          module_version=$(sed -nE "s/^__version__ = '(.*)'/\1/p" python/django_react_forms/__init__.py)
          js_version=$(node -p "require('./js/package.json').version")
          echo "tag=$version python=$python_version module=$module_version js=$js_version"
          # Final releases only: a prerelease is spelled differently in PEP 440 and semver
          test "$python_version" = "$version" && test "$module_version" = "$version" && test "$js_version" = "$version"
      - name: Packaged README/LICENSE match the root copies
        run: for d in python js; do diff README.md $d/README.md && diff LICENSE $d/LICENSE; done

  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing: no token stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build
        working-directory: python
      - run: twine check dist/*
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  github-release:
    # The built files, attached to a GitHub Release. The JS tarball is also how to install the
    # package before (or without) an npm release:
    #   "django-react-forms": "https://github.com/<owner>/django-react-forms/releases/download/v<version>/django-react-forms-<version>.tgz"
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install build
      - run: python -m build
        working-directory: python
      - run: npm ci && npm run build && npm pack
        working-directory: js
      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            python/dist/* js/django-react-forms-*.tgz

  npm:
    # Trusted publishing: npm trusts this workflow (set on the package's npmjs.com settings), so
    # no token is stored. It needs the exact workflow filename (release.yml) and npm 11.5.1+.
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow, and record provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@latest
      - run: npm ci
        working-directory: js
      - run: npm test
        working-directory: js
      - run: npm run build
        working-directory: js
      - run: npm publish --access public
        working-directory: js
