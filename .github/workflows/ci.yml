name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        django: ['4.2', '5.2']
        exclude:
          - { python: '3.13', django: '4.2' } # Django 4.2 doesn't support Python 3.13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "Django==${{ matrix.django }}.*" "telepath>=0.3.1" django-quill-editor "nh3>=0.2.14"
      - name: Packaged README/LICENSE match the root copies
        run: diff README.md python/README.md && diff LICENSE python/LICENSE
      - run: python -m django test tests
        working-directory: python
        env:
          PYTHONPATH: .
          DJANGO_SETTINGS_MODULE: tests.settings

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: python
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          src: python
          args: format --check

  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
        working-directory: js
      - run: npm run typecheck
        working-directory: js
      - run: npm test
        working-directory: js
      - run: npm run build
        working-directory: js
